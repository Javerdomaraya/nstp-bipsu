services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 24h
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    networks:
      - app-internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - edge
      - app-internal

  # Run manually before an application deployment; it is never part of build/start.
  # Invoke it alone and by name -- never by bringing up a whole profile:
  #     docker compose --profile maintenance run --rm migrate
  # The command below is the gated path: it runs the orphan report and the
  # read-only production preflight first, and both fail closed.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["maintenance"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    command: ["npm", "run", "migrate:deploy"]
    networks:
      - app-internal

  # DO NOT RUN THIS AGAINST PRODUCTION.
  #
  # Seeding writes reference data and provisions an administrator account from
  # ADMIN_EMAIL / ADMIN_PASSWORD. It is for local and scratch databases only.
  #
  # This service is deliberately in its own "seed" profile rather than sharing
  # "maintenance" with migrate, so that bringing up the maintenance profile
  # cannot also seed. Migration and seeding must never be coupled.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    command: ["npm", "run", "seed"]
    networks:
      - app-internal

volumes:
  pgdata:

networks:
  edge:
  app-internal:
    internal: true
